[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weekly-status"
version = "0.1.0"
description = "Agentic weekly status pipeline: collect, draft, review, synthesize"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14",
    "anthropic>=0.49",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "typer>=0.15",
    "rich>=13.9",
]

[project.optional-dependencies]
slack = ["slack-bolt>=1.22"]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

[project.scripts]
status = "status.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/status"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["status"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
