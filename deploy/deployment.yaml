# Slack Socket Mode bot — no Service or Route required (outbound WSS only).
# Replace the image reference before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weekly-status-slack-bot
  labels:
    app.kubernetes.io/name: weekly-status
    app.kubernetes.io/component: slack-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: weekly-status
      app.kubernetes.io/component: slack-bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weekly-status
        app.kubernetes.io/component: slack-bot
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bot
          image: weekly-status:latest
          imagePullPolicy: Always
          command: ["status", "slack", "run"]
          envFrom:
            - secretRef:
                name: weekly-status-secrets
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
