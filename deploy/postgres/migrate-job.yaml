# Run once after Postgres is up and weekly-status-secrets has DATABASE_URL set.
# Replace image tag if not using :latest.
apiVersion: batch/v1
kind: Job
metadata:
  name: weekly-status-db-migrate
  labels:
    app.kubernetes.io/name: weekly-status
    app.kubernetes.io/component: db-migrate
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weekly-status
        app.kubernetes.io/component: db-migrate
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: quay.io/yoza/weekly-status:latest
          imagePullPolicy: Always
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: weekly-status-secrets
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 200m
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
