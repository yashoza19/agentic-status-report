# One-off smoke test: collect, draft, and send for one person/week.
# Edit PERSON_ID, WEEK_ENDING, and image before applying.
# Requires full secrets (Jira, GitHub, Anthropic, drafter skill) in weekly-status-secrets.
apiVersion: batch/v1
kind: Job
metadata:
  name: weekly-status-collect-draft-send
  labels:
    app.kubernetes.io/name: weekly-status
    app.kubernetes.io/component: smoke-test
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weekly-status
        app.kubernetes.io/component: smoke-test
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pipeline
          image: weekly-status:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              set -eu
              status collect -p "${PERSON_ID}" --week "${WEEK_ENDING}"
              status draft -p "${PERSON_ID}" --week "${WEEK_ENDING}"
              status send -p "${PERSON_ID}" --week "${WEEK_ENDING}"
          env:
            - name: PERSON_ID
              value: yoza
            - name: WEEK_ENDING
              value: "2026-08-14"
          envFrom:
            - secretRef:
                name: weekly-status-secrets
          resources:
            requests:
              memory: 512Mi
              cpu: 200m
            limits:
              memory: 1Gi
              cpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
