# Copy to secrets.yaml and fill in values. Never commit secrets.

apiVersion: v1
kind: Secret
metadata:
  name: weekly-status-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://user:pass@host:5432/weekly_status
  ANTHROPIC_API_KEY: ""
  SLACK_BOT_TOKEN: ""
  SLACK_APP_TOKEN: ""
  JIRA_BASE_URL: https://issues.redhat.com
  JIRA_EMAIL: ""
  JIRA_API_TOKEN: ""
  GITHUB_TOKEN: ""
  GITHUB_LOGIN: ""
  GITHUB_REPOS: "org/repo1,org/repo2"
  JIRA_EPIC_FIELD: ""
  REPORT_CHANNEL_ID: ""
  PILOT_PERSON_IDS: ""
  DRAFTER_SKILL_ID: ""
  DRAFTER_SKILL_VERSION: latest
  SYNTHESIZER_SKILL_ID: ""
  SYNTHESIZER_SKILL_VERSION: latest
